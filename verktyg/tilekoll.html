<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tilekoll – dataspion för Hitta uteserveringen</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
html{background:#fdf6e8}
body{font-family:system-ui;margin:0;color:#33281a;background:#fdf6e8}
#map{height:55vh}
#panel{display:flex;gap:1rem;padding:1rem;flex-wrap:wrap;align-items:flex-start}
#hm{border:1px solid #d9cdb4;border-radius:8px;cursor:crosshair;image-rendering:pixelated;
  width:300px;height:300px;background:#fdf6e8}
#side{flex:1;min-width:280px}
#out{font-family:ui-monospace,monospace;font-size:.8rem;line-height:1.7;white-space:pre-wrap}
#clusters{font-family:ui-monospace,monospace;font-size:.78rem;margin-top:.8rem;line-height:1.6}
#clusters .big{color:#b3402a;font-weight:700}
#clusters table{border-collapse:collapse;margin-top:.3rem}
#clusters td,#clusters th{border:1px solid #e4d9bd;padding:.15rem .45rem;text-align:right}
#clusters th{background:#f6efe0}
b{color:#e09112}
.flag{font-weight:700}
.flag.yes{color:#3f8a4f}.flag.no{color:#b3402a}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <canvas id="hm" width="300" height="300"></canvas>
  <div id="side">
    <div id="out">Klicka på kartan så ritas en höjdkarta 300×300 m och avvikande
    strukturer mäts upp automatiskt.</div>
    <div id="clusters"></div>
  </div>
</div>
<script>
"use strict";
const rad=Math.PI/180;
function toSweref(lat,lon){
  const a=6378137,f=1/298.257222101,e2=f*(2-f),n=f/(2-f);
  const ah=a/(1+n)*(1+n*n/4+n**4/64),k0=0.9996,FE=500000,lon0=15*rad;
  const A=e2,B=(5*e2**2-e2**3)/6,C=(104*e2**3-45*e2**4)/120,D=1237*e2**4/1260;
  const phi=lat*rad,si=Math.sin(phi);
  const ps=phi-si*Math.cos(phi)*(A+B*si*si+C*si**4+D*si**6);
  const dl=lon*rad-lon0;
  const xi=Math.atan2(Math.tan(ps),Math.cos(dl));
  const eta=Math.atanh(Math.cos(ps)*Math.sin(dl));
  const b1=n/2-2*n*n/3+5*n**3/16+41*n**4/180,b2=13*n*n/48-3*n**3/5+557*n**4/1440;
  const b3=61*n**3/240-103*n**4/140,b4=49561*n**4/161280;
  const N=k0*ah*(xi+b1*Math.sin(2*xi)*Math.cosh(2*eta)+b2*Math.sin(4*xi)*Math.cosh(4*eta)+b3*Math.sin(6*xi)*Math.cosh(6*eta)+b4*Math.sin(8*xi)*Math.cosh(8*eta));
  const E=k0*ah*(eta+b1*Math.cos(2*xi)*Math.sinh(2*eta)+b2*Math.cos(4*xi)*Math.sinh(4*eta)+b3*Math.cos(6*xi)*Math.sinh(6*eta)+b4*Math.cos(8*xi)*Math.sinh(8*eta))+FE;
  return{E,N};
}
let FMT=1,SIZE=512;
const cache=new Map();
function loadImg(src){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      c.width=c.height=SIZE;
      const cx=c.getContext('2d');
      cx.drawImage(img,0,0);
      res(cx.getImageData(0,0,SIZE,SIZE).data);
    };
    img.onerror=()=>res(null);
    img.src=src;
  });
}
async function tile(key){
  if(!cache.has(key))
    cache.set(key,Promise.all([loadImg('tiles/'+key+'.png'),loadImg('tiles/'+key+'_bas.png')]));
  return cache.get(key);
}
const map=L.map('map').setView([59.3064,18.0009],17);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
let mk=null;
fetch('tiles/index.json').then(r=>r.json()).then(idx=>{
  FMT=idx.fmt||1;SIZE=idx.tileSize;
  document.getElementById('out').textContent=
    `index.json: fmt=${FMT}, ${idx.tiles.length} tiles. Klicka på kartan!`;
});
const HM=300;   // meter (1 px = 1 m)
async function ritaHojdkarta(E0,N0){
  const cv=document.getElementById('hm'), cx=cv.getContext('2d');
  const img=cx.createImageData(HM,HM);
  const e0=Math.round(E0-HM/2), n1=Math.round(N0+HM/2);
  const hard=new Float32Array(HM*HM).fill(NaN);
  const bh=new Float32Array(HM*HM).fill(NaN);
  const isB=new Uint8Array(HM*HM);
  // ladda alla berörda tiles
  const behov=new Set();
  const te0=Math.floor(e0/SIZE)*SIZE, te1=Math.floor((e0+HM)/SIZE)*SIZE;
  const tn0=Math.floor((n1-HM)/SIZE)*SIZE, tn1=Math.floor(n1/SIZE)*SIZE;
  for(let e=te0;e<=te1;e+=SIZE) for(let n=tn0;n<=tn1;n+=SIZE)
    behov.add(e+'_'+n);
  const data={};
  for(const k of behov) data[k]=await tile(k);
  let mn=1e9,mx=-1e9;
  for(let r=0;r<HM;r++){
    for(let c=0;c<HM;c++){
      const E=e0+c+0.5, N=n1-r-0.5;
      const te=Math.floor(E/SIZE)*SIZE, tn=Math.floor(N/SIZE)*SIZE;
      const t=data[te+'_'+tn]; if(!t||!t[0]) continue;
      const [d,b]=t;
      const px=Math.floor(E)-te, py=(tn+SIZE-1)-Math.floor(N);
      const i=(py*SIZE+px)*4, v=d[i]*256+d[i+1];
      if(v===0) continue;
      const h=v/10-100;
      hard[r*HM+c]=h; mn=Math.min(mn,h); mx=Math.max(mx,h);
      if(b){ isB[r*HM+c]= b[i+1]>127?1:0; bh[r*HM+c]=b[i+2]*0.5; }
    }
  }
  // färgskala
  for(let i=0;i<HM*HM;i++){
    const h=hard[i], o=i*4;
    if(isNaN(h)){ img.data[o]=250;img.data[o+1]=246;img.data[o+2]=232;img.data[o+3]=255; continue; }
    const t=(h-mn)/Math.max(1e-6,mx-mn);
    // mark grågrön -> hus gult -> extremt rött
    img.data[o]  = t>0.85 ? 220 : 60+t*190;
    img.data[o+1]= t>0.85 ? 60  : 70+t*150;
    img.data[o+2]= t>0.85 ? 50  : 60+t*40;
    img.data[o+3]=255;
  }
  cx.putImageData(img,0,0);
  // rutnät var 50 m
  cx.strokeStyle='rgba(255,255,255,.25)';cx.lineWidth=1;
  for(let g=50;g<HM;g+=50){cx.beginPath();cx.moveTo(g,0);cx.lineTo(g,HM);cx.moveTo(0,g);cx.lineTo(HM,g);cx.stroke();}
  cx.strokeStyle='#33281a';cx.beginPath();cx.arc(HM/2,HM/2,5,0,7);cx.stroke();

  // klusteranalys: byggnadspixlar som sticker upp >8 m över lokal takmedian
  const mark=new Uint8Array(HM*HM);
  const med=[];
  for(let i=0;i<HM*HM;i++) if(isB[i]&&!isNaN(bh[i])) med.push(bh[i]);
  med.sort((a,b)=>a-b);
  const takmed=med.length?med[Math.floor(med.length/2)]:0;
  const grans=takmed+8;
  for(let i=0;i<HM*HM;i++) if(isB[i]&&bh[i]>grans) mark[i]=1;
  const sedd=new Uint8Array(HM*HM), kluster=[];
  for(let i=0;i<HM*HM;i++){
    if(!mark[i]||sedd[i]) continue;
    const kö=[i]; sedd[i]=1;
    let n=0,maxh=0,r0=1e9,r1=-1,c0=1e9,c1=-1;
    while(kö.length){
      const j=kö.pop(); n++;
      const r=(j/HM)|0, c=j%HM;
      maxh=Math.max(maxh,bh[j]);
      r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c);
      for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const rr=r+dr, cc=c+dc;
        if(rr<0||cc<0||rr>=HM||cc>=HM) continue;
        const k=rr*HM+cc;
        if(mark[k]&&!sedd[k]){sedd[k]=1;kö.push(k);}
      }
    }
    kluster.push({n,maxh,br:c1-c0+1,dj:r1-r0+1,c:(c0+c1)/2,r:(r0+r1)/2});
  }
  kluster.sort((a,b)=>b.maxh-a.maxh);
  kluster.slice(0,12).forEach(k=>{
    cx.strokeStyle='#0b7fd4';cx.lineWidth=1.5;
    cx.strokeRect(k.c-k.br/2-2,k.r-k.dj/2-2,k.br+4,k.dj+4);
  });
  const el=document.getElementById('clusters');
  el.innerHTML=`<b>Takmedian i rutan: ${takmed.toFixed(1)} m</b> · gräns för avvikelse: ${grans.toFixed(1)} m<br>`+
    (kluster.length?`<table><tr><th>#</th><th>maxhöjd</th><th>bredd×djup</th><th>pixlar</th></tr>`+
      kluster.slice(0,10).map((k,i)=>`<tr><td>${i+1}</td>`+
        `<td class="${k.maxh>takmed+20?'big':''}">${k.maxh.toFixed(1)} m</td>`+
        `<td>${k.br}×${k.dj} m</td><td>${k.n}</td></tr>`).join('')+`</table>`
      :'Inga avvikande strukturer i rutan.');
}

map.on('click',async ev=>{
  const {E,N}=toSweref(ev.latlng.lat,ev.latlng.lng);
  const te=Math.floor(E/SIZE)*SIZE, tn=Math.floor(N/SIZE)*SIZE;
  const key=te+'_'+tn;
  const [d,b]=await tile(key);
  ritaHojdkarta(E,N);
  if(mk)map.removeLayer(mk);
  mk=L.circleMarker(ev.latlng,{radius:7,color:'#33281a',fillColor:'#f7b32b',fillOpacity:1}).addTo(map);
  const o=document.getElementById('out');
  if(!d){o.textContent=`tile ${key}: SAKNAS (utanför täckning?)`;return;}
  const px=Math.floor(E)-te, py=(tn+SIZE-1)-Math.floor(N);
  const i=(py*SIZE+px)*4;
  const v=d[i]*256+d[i+1];
  if(v===0){o.textContent=`tile ${key} px(${px},${py}): NODATA`;return;}
  const hard=v/10-100;
  const vegTop=d[i+2]*0.5;
  const basR=b?b[i]:null, flagG=b?b[i+1]:null, bhB=b?b[i+2]:null;
  const isB=FMT>=2&&b&&flagG>127;
  o.innerHTML=
`E ${E.toFixed(1)}  N ${N.toFixed(1)}   tile <b>${key}</b>  px(${px},${py})

HUVUDTILE  R,G,B = ${d[i]},${d[i+1]},${d[i+2]}
  hård yta (mark+hus):  <b>${hard.toFixed(1)} m</b> (RH2000)
  krontopp över hård:   <b>${vegTop.toFixed(1)} m</b>

BASFIL     ${b?`R,G,B = ${basR},${flagG},${bhB}`:'<span class="flag no">SAKNAS (_bas.png hittades inte!)</span>'}
  kronbas över hård:    ${b?(basR*0.5).toFixed(1)+' m':'–'}
  byggnadsflagga (G):   <span class="flag ${isB?'yes':'no'}">${b?(isB?'JA ('+flagG+')':'NEJ ('+flagG+')'):'–'}</span>
  hushöjd över mark(B): ${b?(bhB*0.5).toFixed(1)+' m':'–'}
  => marknivå:          ${b&&isB?(hard-bhB*0.5).toFixed(1)+' m':hard.toFixed(1)+' m (=hård yta)'}

fmt i index.json: ${FMT} ${FMT>=2?'':'← PROBLEM: appen ignorerar basfilens flaggor vid fmt<2'}`;
});
</script>
</body>
</html>
